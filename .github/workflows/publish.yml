name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish npm package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p \"require('./packages/ui/package.json').version\")"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v$tag_version does not match @nooeh/ui@$package_version."
            exit 1
          fi

      - run: pnpm release:check

      - name: Publish unpublished workspace packages
        run: |
          publish_if_needed() {
            package_directory="$1"
            package_name="$(node -p "require('./' + process.argv[1] + '/package.json').name" "$package_directory")"
            package_version="$(node -p "require('./' + process.argv[1] + '/package.json').version" "$package_directory")"

            if npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published."
              return
            fi

            pnpm --dir "$package_directory" publish --access public --provenance
          }

          publish_if_needed packages/registry
          publish_if_needed packages/tokens
          publish_if_needed packages/cli
          publish_if_needed packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKENS }}
